<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title>Appcovi trust kit</title><desc>Six original Appcovi poultry trust seals.</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".35"/></filter><filter id="silver"><feColorMatrix type="saturate" values=".12"/><feComponentTransfer><feFuncR type="linear" slope="1.2" intercept=".18"/><feFuncG type="linear" slope="1.2" intercept=".18"/><feFuncB type="linear" slope="1.2" intercept=".18"/></feComponentTransfer></filter><filter id="gold"><feColorMatrix type="saturate" values=".72"/><feComponentTransfer><feFuncR type="linear" slope="1.1" intercept=".18"/><feFuncG type="linear" slope=".82" intercept=".1"/><feFuncB type="linear" slope=".45"/></feComponentTransfer></filter></defs><rect width="1200" height="350" rx="30" fill="#092b27"/><g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#s)"><g transform="translate(105 175)"><circle r="130" fill="#d6ad42" stroke="#fff0a5" stroke-width="8"/><circle r="111" fill="#102f3b" stroke="#e8c85d" stroke-width="4"/><text y="8" fill="#ffe8a2" font-size="72">🐔</text><text y="75" fill="#ffe8a2" font-size="18" font-weight="bold">POULTRY FOCUSED</text><text y="98" fill="#fff" font-size="11" letter-spacing="2">APP COVI TRUST KIT</text></g><g transform="translate(305 175)"><circle r="130" fill="#b9c1c4" stroke="#f8ffff" stroke-width="8"/><circle r="111" fill="#123c35" stroke="#dbe3e3" stroke-width="4"/><text y="8" fill="#fff" font-size="72">🐓</text><text y="48" fill="#fff" font-size="17" font-weight="bold">PRACTICAL TOOLS</text><text y="72" fill="#dce9e6" font-size="11" letter-spacing="2">MADE FOR FARM WORK</text></g><g transform="translate(505 175)"><circle r="130" fill="#d6ad42" stroke="#fff0a5" stroke-width="8"/><circle r="111" fill="#123c35" stroke="#e8c85d" stroke-width="4"/><text y="8" fill="#ffe8a2" font-size="72">🦚</text><text y="48" fill="#fff" font-size="19" font-weight="bold">APPCOVI ORIGINAL</text><text y="72" fill="#fff1c4" font-size="11" letter-spacing="2">BUILT WITH PURPOSE</text></g><g transform="translate(705 175)"><circle r="130" fill="#b9c1c4" stroke="#f8ffff" stroke-width="8"/><circle r="111" fill="#102f3b" stroke="#dbe3e3" stroke-width="4"/><text y="8" fill="#fff" font-size="72">🐣</text><text y="48" fill="#fff" font-size="18" font-weight="bold">NO PAYMENT DATA</text><text y="72" fill="#dce9e6" font-size="11" letter-spacing="2">SHOWCASE SITE</text></g><g transform="translate(905 175)"><circle r="130" fill="#d6ad42" stroke="#fff0a5" stroke-width="8"/><circle r="111" fill="#123c35" stroke="#e8c85d" stroke-width="4"/><text y="8" fill="#ffe8a2" font-size="72">🦃</text><text y="48" fill="#fff" font-size="18" font-weight="bold">CLEAR PRODUCT INFO</text><text y="72" fill="#fff1c4" font-size="11" letter-spacing="2">EXPLORE THE SUITE</text></g><g transform="translate(1105 175)"><circle r="130" fill="#a7653f" stroke="#e4ad7f" stroke-width="8"/><circle r="111" fill="#302522" stroke="#c8875b" stroke-width="4"/><text y="8" fill="#ffd3ae" font-size="72">🦆</text><text y="48" fill="#fff" font-size="17" font-weight="bold">FARM PRACTICAL</text><text y="72" fill="#f1c4a3" font-size="11" letter-spacing="2">APP COVI</text></g></g></svg>
